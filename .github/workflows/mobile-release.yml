name: Mobile Release

on:
  push:
    tags:
      - "mobile-v*"
    branches:
      - main
    paths:
      # Native config / version changes need a fresh APK (JS-only changes go
      # through the OTA workflow instead). Touching any of these on main
      # triggers a cloud build automatically.
      - "mobile/app.json"
      - "mobile/package.json"
      - "mobile/eas.json"
      - "mobile/google-services.json"
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать в mobile-latest (иначе — только тестовая сборка: артефакт + ссылка EAS)"
        required: false
        default: false
        type: boolean

# Publishes the finished APK to the rolling "mobile-latest" release so the
# permanent URL below always serves the newest build (desktop profile shows
# it as a QR code):
#   https://github.com/Papa-Gandola/gandolachat/releases/download/mobile-latest/gandolachat.apk
#
# ТЕСТОВАЯ СБОРКА С ВЕТКИ: Actions → Mobile Release → Run workflow → выбрать
# ветку, publish = false. APK не уйдёт в mobile-latest (на него смотрят QR и
# «обнови меня» у всех), а ляжет артефактом прогона + прямой ссылкой EAS в
# сводке. Так проверяют нативные изменения (новый SDK, разрешения) на своём
# телефоне ДО мержа в main.
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mobile
    steps:
      # v5: v4 ругались на устаревший Node 20 раннера (грабля №15)
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build preview APK (cloud, wait for finish)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --profile preview --platform android --non-interactive --json > build.json
          APK_URL=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' build.json)
          if [ -z "$APK_URL" ]; then
            echo "eas build produced no artifact URL:"; cat build.json; exit 1
          fi
          curl -fL --retry 3 -o gandolachat.apk "$APK_URL"
          ls -lh gandolachat.apk
          {
            echo "### APK"
            echo "- Версия: $(jq -r '.expo.version' app.json) (сборка $(jq -r '.expo.android.versionCode' app.json), runtime $(jq -r '.expo.runtimeVersion' app.json))"
            echo "- Прямая ссылка EAS: $APK_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gandolachat-apk
          path: mobile/gandolachat.apk
          retention-days: 14

      - name: Publish rolling release mobile-latest
        # Ручной прогон без publish=true — только тестовая сборка
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r '.expo.version' app.json)
          VCODE=$(jq -r '.expo.android.versionCode' app.json)
          # prerelease keeps it out of the repo's "latest" slot, which belongs
          # to desktop releases (v2.x.x).
          gh release delete mobile-latest --yes --cleanup-tag || true
          gh release create mobile-latest gandolachat.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "GandolaChat Android ${VERSION} (сборка ${VCODE})" \
            --notes "Постоянная ссылка на свежий APK: https://github.com/${{ github.repository }}/releases/download/mobile-latest/gandolachat.apk"
